worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # Docker internal DNS resolver with 5s TTL to handle container scaling/restarts
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    upstream backend_servers {
        # 'backend' matches the service name in docker-compose.yml
        # Docker's internal DNS resolves this to all container IPs for that service
        server backend:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;

        # Enable Gzip Compression for text responses
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;

        # Baseline hardening headers. TLS-dependent ones (HSTS) belong at the terminator
        # in front of this proxy (e.g. the platform's edge/CDN) once certs are provisioned.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Payload size boundary for document analysis & upload
        client_max_body_size 25M;

        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # The analysis pipeline's 6-minute-per-call agent timeout (with retries) and
            # the SSE progress stream (GET /api/analysis/:id/stream, kept open for the
            # life of a run) both outlast nginx's 60s default read timeout — bump it.
            proxy_read_timeout 360s;
        }

        # SSE progress and chat streams: must not be buffered, or events sit in nginx's buffer
        # instead of reaching the browser as they're published.
        location ~* (/stream/?$) {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 360s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Fast Health Check Proxy
        location ~ ^/api/health {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
    }
}
