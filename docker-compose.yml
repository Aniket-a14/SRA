services:
  nginx:
    image: nginx:alpine
    container_name: sra-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # container_name: sra-backend  <-- Removed to allow scaling
    restart: always
    env_file:
      - ./backend/.env
    # ports:
    #   - "3000:3000" # Commented out to force traffic through Nginx (Load Balancer)
    environment:
      # This compose file is a local/self-hosted profile: nginx here has no TLS, and the
      # frontend below points at it over plain http://localhost:8080. Production mode's CSP
      # forbids localhost and forces upgrade-insecure-requests, which breaks exactly that
      # setup — so the default here is development, with production available for anyone
      # who has actually put TLS in front of this stack.
      - NODE_ENV=${NODE_ENV:-development}
      - AI_NAME=SRA
    deploy:
      replicas: 2 # Simulate Load Balancing with 2 instances
      resources:
        limits:
          memory: 512M
    stop_grace_period: 40s
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sra-frontend
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # Update to point to Nginx Load Balancer!
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3001').then(r => r.ok ? process.exit(0) : process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    container_name: sra-cli
    volumes:
      # Scoped to a dedicated subdirectory rather than the repo root: the root also holds
      # backend/.env, frontend/.env and terraform/ secrets the CLI container has no reason
      # to see. Point this at whichever project the CLI should scan.
      - ./workspace:/app/workspace
    environment:
      - SRA_API_KEY=${SRA_API_KEY}
    profiles: [ "tools" ] # Prevent it from starting by default during up
