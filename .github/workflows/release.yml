name: Release Automation

# Covers the manual path only: a tag pushed by a human (`git tag v1.2.3 && git push --tags`).
# Tags created by auto-tag.yml do NOT reach here — GitHub suppresses workflow triggers for
# events made with the default GITHUB_TOKEN — so auto-tag.yml creates its own release.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
