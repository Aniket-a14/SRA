name: Automated Database Backup

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install
        working-directory: .

      - name: Install PostgreSQL client
        # This step was titled "Install PostgreSQL 17 client" and installed 16.14, because
        # `apt-key add` is a no-op on Ubuntu 24.04 — the pgdg repo stayed untrusted, apt
        # silently fell back to Ubuntu's own postgresql-client-16, and the `pg_dump
        # --version` line printed the wrong version without failing. Once the database moved
        # to PostgreSQL 17, every backup aborted on "server version mismatch".
        #
        # Fixed by trusting the repo with a signed-by keyring, and by asserting the result
        # instead of printing it.
        env:
          PG_MAJOR: '17'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # gpg runs unprivileged and the write is done by tee. Under `sudo gpg -o …` it
          # tries to open /dev/tty, which a runner does not have, and dies with
          # "cannot open '/dev/tty'".
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor --batch --yes \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-${PG_MAJOR}"

          INSTALLED=$(pg_dump --version | grep -oP '\d+' | head -1)
          echo "pg_dump major version: $INSTALLED"
          if [ "$INSTALLED" -lt "$PG_MAJOR" ]; then
            echo "::error::Expected pg_dump >= $PG_MAJOR but got $INSTALLED. pg_dump cannot dump a newer server, so the backup would abort."
            exit 1
          fi

      - name: Create backup
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_SALT: ${{ secrets.BACKUP_ENCRYPTION_SALT }}
          BACKUP_DIR: ./backups
        run: |
          node scripts/backup-cli.js create

      - name: Upload backup to artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: backend/backups/*.enc
          retention-days: 30
          # Without this the step defaults to a warning: if BACKUP_ENCRYPTION_KEY were ever
          # unset the dump would stay unencrypted, this glob would match nothing, and the
          # run would report success having stored no backup at all.
          if-no-files-found: error

      - name: Verify backup integrity
        working-directory: ./backend
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_SALT: ${{ secrets.BACKUP_ENCRYPTION_SALT }}
          BACKUP_DIR: ./backups
        run: |
          LATEST_BACKUP=$(ls -t backups/*.enc | head -1)
          node scripts/backup-cli.js verify $(basename $LATEST_BACKUP)

      - name: Cleanup old backups
        working-directory: ./backend
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_SALT: ${{ secrets.BACKUP_ENCRYPTION_SALT }}
          BACKUP_DIR: ./backups
          BACKUP_RETENTION_DAYS: 30
        run: |
          node scripts/backup-cli.js cleanup

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          # Comment on the existing alert instead of opening a new one. A weekly outage
          # opened a fresh identical issue every Sunday — five accumulated before anyone
          # noticed, which is noise that trains you to ignore the alert rather than read it.
          # One issue per outage, with a comment per recurrence, keeps the signal.
          script: |
            const title = '🚨 Automated Backup Failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Automated database backup failed on ${new Date().toISOString()}\n\nWorkflow run: ${runUrl}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup',
            });
            const open = existing.data.find((issue) => issue.title === title);

            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Still failing.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['backup', 'critical'],
              });
            }

      - name: Send success notification
        if: success()
        run: |
          echo "✅ Backup completed successfully"
          # TODO: Add Slack/email notification
