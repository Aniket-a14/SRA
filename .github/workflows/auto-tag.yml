name: Auto Tag Project Version

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/package.json'
      - 'frontend/package.json'
      - 'cli/package.json'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: package-version
        working-directory: ./backend
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package-version.outputs.version }}
        id: tag-logic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v$VERSION"
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote. Skipping."
            echo "tag_created=false" >> $GITHUB_OUTPUT
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            echo "tag_created=true" >> $GITHUB_OUTPUT
          fi
      # This job creates the release itself, and must.
      #
      # It previously delegated to release.yml "which triggers on this tag push". It does
      # not: GitHub deliberately suppresses workflow triggers for events created with the
      # default GITHUB_TOKEN, to stop workflows recursing. So the tag push above fires
      # nothing, and release.yml has not run since v3.0.6 (2026-01-31) — every release from
      # v4.0.0 to v4.2.0 had to be created by hand.
      #
      # release.yml is still useful for a tag a human pushes directly (a user token does
      # trigger it), which is why it stays. The guard below keeps the two from
      # double-creating a release for the same tag.
      - name: Create GitHub Release
        if: steps.tag-logic.outputs.tag_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
