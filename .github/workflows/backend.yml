name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install
      working-directory: .

    - name: Run Lint
      run: pnpm --filter backend run lint
      working-directory: ./backend

    - name: Security Scan
      # --prod scopes this to runtime dependencies (dev-only tooling like jest/eslint/prisma-cli
      # isn't shipped, so its advisories don't need to block a merge). This step fails the
      # build on any high-severity production CVE, with no allowlist.
      #
      # The brace-expansion advisories that used to need one reached this scan because
      # nodemon — a dev-only file watcher — sat in `dependencies`, pulling minimatch into the
      # production graph. It is a devDependency now (nothing in production invokes it: the
      # start script and the Dockerfile both run `node src/server.js` directly), which is
      # what the old allowlist comment already claimed but the manifest contradicted.
      #
      # Re-adding an exception means a real production vulnerability is being waved through —
      # document it in .github/SECURITY_EXEMPTIONS.md if you ever must.
      run: |
        set +e
        AUDIT_JSON=$(pnpm audit --prod --audit-level=high --json)
        set -e
        echo "$AUDIT_JSON" | node -e '
          let data = "";
          process.stdin.on("data", d => data += d);
          process.stdin.on("end", () => {
            const j = JSON.parse(data || "{}");
            const remaining = Object.values(j.advisories || {}).filter(a => a.severity === "high");
            if (remaining.length > 0) {
              console.error("High-severity vulnerabilities found in production dependencies:");
              remaining.forEach(a => console.error(`- ${a.title} (${a.module_name})`));
              process.exit(1);
            }
            console.log("No high-severity vulnerabilities in production dependencies.");
          });
        '
      working-directory: ./backend

    - name: Run Tests with Coverage
      # A dedicated script, not `test -- --coverage`: pnpm forwards the separator itself, so
      # Jest received a literal `--` as a test path filter, matched nothing, and exited 1
      # with "No tests found". The step never surfaced it because Security Scan failed first.
      run: pnpm --filter backend run test:coverage
      working-directory: ./backend
      env:
        CI: true

    - name: Upload Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: backend/coverage
