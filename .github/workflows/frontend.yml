name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install
      working-directory: .

    - name: Run Lint
      run: pnpm --filter frontend run lint
      working-directory: ./frontend

    - name: Type Check
      run: npx tsc --noEmit
      working-directory: ./frontend

    # This job has been called build-and-test since it was written, but never ran the tests —
    # lib/ unit tests and the component render tests were green locally and unenforced here.
    - name: Run Tests
      run: pnpm --filter frontend run test
      working-directory: ./frontend

    - name: Security Scan
      # --prod scopes this to runtime dependencies. pnpm audits the whole workspace lockfile
      # even from here, so this sees the backend's graph too. No allowlist: the
      # brace-expansion advisories that used to need one came in through nodemon sitting in
      # the backend's `dependencies` and dragging minimatch along with it. nodemon is a
      # devDependency now, so the production graph no longer contains it.
      run: |
        set +e
        AUDIT_JSON=$(pnpm audit --prod --audit-level=high --json)
        set -e
        echo "$AUDIT_JSON" | node -e '
          let data = "";
          process.stdin.on("data", d => data += d);
          process.stdin.on("end", () => {
            const j = JSON.parse(data || "{}");
            const remaining = Object.values(j.advisories || {}).filter(a => a.severity === "high");
            if (remaining.length > 0) {
              console.error("High-severity vulnerabilities found in production dependencies:");
              remaining.forEach(a => console.error(`- ${a.title} (${a.module_name})`));
              process.exit(1);
            }
            console.log("No high-severity vulnerabilities in production dependencies.");
          });
        '
      working-directory: ./frontend

    - name: Run Build
      run: pnpm --filter frontend run build
      working-directory: ./frontend

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Install Playwright's Chromium
      run: npx playwright install --with-deps chromium
      working-directory: ./frontend

    - name: Run Playwright E2E suite
      # playwright.config.ts's webServer starts `npm run dev` itself with
      # NEXT_PUBLIC_BACKEND_URL pointed at an address nothing listens on — every request the
      # specs make is mocked at the browser network layer (see tests/e2e/mocks.ts), so this
      # needs no backend, database, or real provider keys.
      run: pnpm --filter frontend run test:e2e
      env:
        CI: 'true'

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report
        retention-days: 14
